services:
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: "5000"
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:?Set NEON_DATABASE_URL in .env}
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - api
    expose:
      - "3000"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
      - frontend
    ports:
      - "0.0.0.0:3000:80"
    restart: unless-stopped