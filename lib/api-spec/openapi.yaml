openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Approved staff authentication
  - name: users
    description: Event planner user management
  - name: invites
    description: Guest invitation and check-in operations
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in an approved staff user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List staff accounts
      responses:
        "200":
          description: Staff accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create an approved staff account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Staff account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a staff account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Staff account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid account update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List invitations
      responses:
        "200":
          description: Invitations ordered by creation time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: Invalid invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /invites/summary:
    get:
      operationId: getInviteSummary
      tags: [invites]
      summary: Get invitation and arrival totals
      responses:
        "200":
          description: Current invitation totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteSummary"
  /invites/resolve:
    post:
      operationId: resolveInvite
      tags: [invites]
      summary: Validate a scanned QR payload and retrieve its invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteScanInput"
      responses:
        "200":
          description: The scan result, including invalid codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteScanResult"
  /invites/{id}:
    get:
      operationId: getInvite
      tags: [invites]
      summary: Get one invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateInvite
      tags: [invites]
      summary: Update an invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInviteInput"
      responses:
        "200":
          description: Invitation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: Invalid invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteInvite
      tags: [invites]
      summary: Delete an invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation deleted
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /invites/{id}/check-in:
    post:
      operationId: checkInInvite
      tags: [invites]
      summary: Mark an invitation as arrived
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The arrival result, including repeated check-ins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: guest_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserRole:
      type: string
      enum: [event_planner, guest_list_checker]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, username, displayName, role, isActive, createdAt]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [username, password]
    CreateUserInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]+$"
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 128
        role:
          $ref: "#/components/schemas/UserRole"
      required: [username, displayName, password, role]
    UpdateUserInput:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
        password:
          type: string
          minLength: 12
          maxLength: 128
    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        numberOfGuests:
          type: integer
          minimum: 1
          maximum: 20
        phoneNumber:
          type: string
        email:
          type: string
          nullable: true
        createdByName:
          type: string
          nullable: true
        inviteCode:
          type: string
        rsvpStatus:
          $ref: "#/components/schemas/RsvpStatus"
        createdAt:
          type: string
          format: date-time
        arrivedAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - fullName
        - numberOfGuests
        - phoneNumber
        - email
        - createdByName
        - inviteCode
        - rsvpStatus
        - createdAt
        - arrivedAt
    RsvpStatus:
      type: string
      enum: [pending, accepted, declined]
    InviteInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        numberOfGuests:
          type: integer
          minimum: 1
          maximum: 20
        phoneNumber:
          type: string
          minLength: 5
          maxLength: 30
        email:
          type: string
          maxLength: 254
      required:
        - fullName
        - numberOfGuests
        - phoneNumber
    UpdateInviteInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        numberOfGuests:
          type: integer
          minimum: 1
          maximum: 20
        phoneNumber:
          type: string
          minLength: 5
          maxLength: 30
        email:
          type: string
          maxLength: 254
        rsvpStatus:
          $ref: "#/components/schemas/RsvpStatus"
      required:
        - fullName
        - numberOfGuests
        - phoneNumber
        - rsvpStatus
    InviteScanInput:
      type: object
      properties:
        qrPayload:
          type: string
          minLength: 1
          maxLength: 2048
      required:
        - qrPayload
    InviteScanResult:
      type: object
      properties:
        status:
          type: string
          enum: [valid, already_checked_in, not_valid]
        invite:
          anyOf:
            - $ref: "#/components/schemas/Invite"
            - type: "null"
      required: [status, invite]
    CheckInResult:
      type: object
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        alreadyCheckedIn:
          type: boolean
      required: [invite, alreadyCheckedIn]
    InviteSummary:
      type: object
      properties:
        totalInvites:
          type: integer
        totalGuests:
          type: integer
        arrivedInvites:
          type: integer
        arrivedGuests:
          type: integer
      required: [totalInvites, totalGuests, arrivedInvites, arrivedGuests]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
